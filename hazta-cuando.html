<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡¿Hazta Cuándo?! — Modo Ranked</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --purple-900: #0D0B1A;
    --purple-800: #16122E;
    --purple-700: #26215C;
    --purple-600: #3C3489;
    --purple-500: #534AB7;
    --purple-400: #7F77DD;
    --purple-300: #AFA9EC;
    --purple-200: #CECBF6;
    --purple-100: #EEEDFE;
    --gold: #C8A94A;
    --gold-light: #F0D080;
    --silver: #A8B4C8;
    --accent: #8B5CF6;
    --danger: #E24B4A;
    --success: #1D9E75;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--purple-900);
    color: var(--purple-100);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Fondo con patrón hexagonal sutil */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(ellipse at 20% 50%, rgba(83,74,183,0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(127,119,221,0.1) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 16px; }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: rgba(38,33,92,0.6);
    border: 1px solid rgba(127,119,221,0.3);
    border-radius: 12px;
    margin-bottom: 16px;
    backdrop-filter: blur(8px);
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-size: 16px;
    font-weight: 900;
    color: var(--purple-200);
    letter-spacing: 0.05em;
  }

  .logo span { color: var(--gold); }

  .rank-badge {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .rank-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .rank-info { text-align: right; }
  .rank-name { font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 700; color: var(--gold); }
  .rank-pts { font-size: 11px; color: var(--purple-300); }

  .streak-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(200,169,74,0.15);
    border: 1px solid rgba(200,169,74,0.4);
    padding: 6px 12px;
    border-radius: 20px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--gold);
  }

  /* GRID PRINCIPAL */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  @media (max-width: 600px) {
    .main-grid { grid-template-columns: 1fr; }
  }

  /* PANEL CARD */
  .panel {
    background: rgba(22,18,46,0.8);
    border: 1px solid rgba(83,74,183,0.4);
    border-radius: 16px;
    padding: 20px;
    backdrop-filter: blur(8px);
  }

  .panel-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--purple-400);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-title::before {
    content: '';
    width: 3px;
    height: 14px;
    background: var(--purple-500);
    border-radius: 2px;
    display: inline-block;
  }

  /* METRÓNOMO */
  .bpm-display {
    text-align: center;
    margin: 8px 0 16px;
  }

  .bpm-number {
    font-family: 'Orbitron', monospace;
    font-size: 64px;
    font-weight: 900;
    color: var(--purple-100);
    line-height: 1;
    text-shadow: 0 0 30px rgba(127,119,221,0.5);
  }

  .bpm-label {
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    color: var(--purple-400);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .pendulum-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 70px;
    margin: 8px 0;
  }

  .pendulum-track {
    width: 120px;
    height: 4px;
    background: rgba(83,74,183,0.3);
    border-radius: 2px;
    position: relative;
    overflow: visible;
  }

  .pendulum-dot {
    width: 20px;
    height: 20px;
    background: var(--purple-400);
    border-radius: 50%;
    position: absolute;
    top: -8px;
    left: 0;
    box-shadow: 0 0 12px rgba(127,119,221,0.8);
    transition: background 0.1s;
  }

  .pendulum-dot.beat {
    background: var(--gold);
    box-shadow: 0 0 20px rgba(200,169,74,0.9);
  }

  .pendulum-dot.accent {
    background: var(--gold-light);
    box-shadow: 0 0 24px rgba(240,208,128,1);
    transform: scale(1.3);
  }

  @keyframes swing {
    0% { left: 0; }
    50% { left: calc(100% - 20px); }
    100% { left: 0; }
  }

  .pendulum-dot.playing {
    animation: swing linear infinite;
  }

  .beat-lights {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 10px 0;
  }

  .beat-light {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(83,74,183,0.3);
    border: 1px solid rgba(83,74,183,0.5);
    transition: all 0.05s;
  }

  .beat-light.active {
    background: var(--gold);
    box-shadow: 0 0 10px rgba(200,169,74,0.8);
    border-color: var(--gold-light);
  }

  .beat-light.accent-light {
    background: var(--gold-light);
    box-shadow: 0 0 14px rgba(240,208,128,1);
    transform: scale(1.3);
  }

  /* CONTROLES */
  .bpm-slider {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(83,74,183,0.4);
    outline: none;
    margin: 8px 0 16px;
  }

  .bpm-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--purple-400);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(127,119,221,0.6);
  }

  .btn-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .btn {
    flex: 1;
    padding: 10px 8px;
    border-radius: 8px;
    border: 1px solid rgba(83,74,183,0.5);
    background: rgba(83,74,183,0.2);
    color: var(--purple-200);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .btn:hover { background: rgba(83,74,183,0.4); border-color: var(--purple-400); }
  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: var(--purple-600);
    border-color: var(--purple-400);
    color: var(--purple-100);
  }

  .btn-primary:hover { background: var(--purple-500); }

  .btn-play {
    background: var(--purple-500);
    border-color: var(--purple-300);
    font-size: 16px;
    padding: 12px;
  }

  .btn-play.playing {
    background: rgba(226,75,74,0.3);
    border-color: var(--danger);
    color: var(--danger);
  }

  .btn-tap {
    background: rgba(200,169,74,0.15);
    border-color: rgba(200,169,74,0.5);
    color: var(--gold);
  }

  .btn-tap:hover { background: rgba(200,169,74,0.25); border-color: var(--gold); }

  /* SUBDIVISION */
  .sub-row {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }

  .sub-btn {
    flex: 1;
    padding: 7px 4px;
    border-radius: 6px;
    border: 1px solid rgba(83,74,183,0.4);
    background: rgba(22,18,46,0.5);
    color: var(--purple-300);
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    letter-spacing: 0.05em;
  }

  .sub-btn.active {
    background: rgba(83,74,183,0.4);
    border-color: var(--purple-400);
    color: var(--purple-100);
  }

  /* RITMOS */
  .rhythm-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .rhythm-btn {
    padding: 8px 6px;
    border-radius: 8px;
    border: 1px solid rgba(83,74,183,0.3);
    background: rgba(22,18,46,0.6);
    color: var(--purple-300);
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    padding-left: 10px;
  }

  .rhythm-btn .r-bpm { font-size: 10px; color: var(--purple-400); display: block; }
  .rhythm-btn:hover { border-color: var(--purple-400); background: rgba(83,74,183,0.2); color: var(--purple-100); }
  .rhythm-btn.active { border-color: var(--gold); background: rgba(200,169,74,0.1); color: var(--gold); }
  .rhythm-btn.active .r-bpm { color: var(--gold-light); }

  /* AFINADOR */
  .tuner-note {
    text-align: center;
    margin: 8px 0;
  }

  .note-big {
    font-family: 'Orbitron', monospace;
    font-size: 56px;
    font-weight: 900;
    line-height: 1;
    transition: color 0.2s;
  }

  .note-freq { font-size: 12px; color: var(--purple-400); margin-top: 4px; }

  .tuner-meter {
    position: relative;
    height: 24px;
    background: rgba(83,74,183,0.2);
    border-radius: 12px;
    border: 1px solid rgba(83,74,183,0.4);
    margin: 12px 0;
    overflow: hidden;
  }

  .tuner-center {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: rgba(127,119,221,0.5);
    transform: translateX(-50%);
  }

  .tuner-needle {
    position: absolute;
    top: 4px;
    bottom: 4px;
    width: 4px;
    border-radius: 2px;
    background: var(--purple-300);
    left: 50%;
    transform: translateX(-50%);
    transition: left 0.15s ease, background 0.2s;
  }

  .tuner-labels {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--purple-400);
    margin-bottom: 12px;
    font-family: 'Rajdhani', sans-serif;
  }

  .tuner-status {
    text-align: center;
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 8px;
    border-radius: 8px;
    margin-bottom: 12px;
  }

  .status-low { background: rgba(226,75,74,0.15); color: var(--danger); border: 1px solid rgba(226,75,74,0.3); }
  .status-high { background: rgba(226,75,74,0.15); color: var(--danger); border: 1px solid rgba(226,75,74,0.3); }
  .status-in { background: rgba(29,158,117,0.15); color: var(--success); border: 1px solid rgba(29,158,117,0.3); }
  .status-idle { background: rgba(83,74,183,0.15); color: var(--purple-400); border: 1px solid rgba(83,74,183,0.3); }

  .instrument-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .inst-btn {
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid rgba(83,74,183,0.3);
    background: rgba(22,18,46,0.5);
    color: var(--purple-300);
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }

  .inst-btn.active { border-color: var(--purple-400); background: rgba(83,74,183,0.3); color: var(--purple-100); }

  /* RANGOS */
  .ranks-panel { grid-column: 1 / -1; }

  .ranks-track {
    display: flex;
    gap: 6px;
    align-items: center;
    overflow-x: auto;
    padding-bottom: 8px;
  }

  .rank-item {
    flex-shrink: 0;
    text-align: center;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(83,74,183,0.3);
    background: rgba(22,18,46,0.5);
    min-width: 80px;
    opacity: 0.5;
    transition: all 0.2s;
  }

  .rank-item.achieved { opacity: 1; border-color: var(--purple-400); background: rgba(83,74,183,0.2); }
  .rank-item.current { border-color: var(--gold); background: rgba(200,169,74,0.1); opacity: 1; box-shadow: 0 0 12px rgba(200,169,74,0.2); }

  .rank-item-icon { font-size: 22px; margin-bottom: 4px; }
  .rank-item-name { font-family: 'Rajdhani', sans-serif; font-size: 10px; font-weight: 700; color: var(--purple-300); text-transform: uppercase; }
  .rank-item.current .rank-item-name { color: var(--gold); }

  .xp-bar-wrap {
    margin-top: 10px;
  }

  .xp-bar-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--purple-400); margin-bottom: 4px; font-family: 'Rajdhani', sans-serif; }
  .xp-bar { height: 6px; background: rgba(83,74,183,0.3); border-radius: 3px; overflow: hidden; }
  .xp-fill { height: 100%; width: 35%; background: linear-gradient(90deg, var(--purple-500), var(--gold)); border-radius: 3px; transition: width 0.5s ease; }

  /* TIMER */
  .timer-display {
    font-family: 'Orbitron', monospace;
    font-size: 32px;
    font-weight: 700;
    text-align: center;
    color: var(--purple-200);
    margin: 8px 0;
  }

  .session-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }

  .stat-box {
    background: rgba(83,74,183,0.15);
    border: 1px solid rgba(83,74,183,0.3);
    border-radius: 8px;
    padding: 8px 10px;
    text-align: center;
  }

  .stat-num { font-family: 'Orbitron', monospace; font-size: 18px; font-weight: 700; color: var(--purple-200); }
  .stat-lbl { font-size: 10px; color: var(--purple-400); font-family: 'Rajdhani', sans-serif; text-transform: uppercase; letter-spacing: 0.1em; }

  /* NOTIF */
  .notif {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(200,169,74,0.9);
    color: #1A1200;
    padding: 10px 20px;
    border-radius: 20px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 14px;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">¡¿<span>H</span>azta <span>C</span>uándo?!</div>
    <div class="streak-pill">🔥 <span id="streakCount">1</span> día</div>
    <div class="rank-badge">
      <div class="rank-info">
        <div class="rank-name" id="rankName">ORO III</div>
        <div class="rank-pts" id="rankPts">847 / 1200 XP</div>
      </div>
      <div class="rank-icon" id="rankIcon">🏅</div>
    </div>
  </div>

  <!-- GRID -->
  <div class="main-grid">

    <!-- METRÓNOMO -->
    <div class="panel">
      <div class="panel-title">Metrónomo</div>

      <div class="bpm-display">
        <div class="bpm-number" id="bpmDisplay">120</div>
        <div class="bpm-label">BPM · <span id="rhythmName">Libre</span></div>
      </div>

      <div class="pendulum-wrap">
        <div class="pendulum-track">
          <div class="pendulum-dot" id="pendulumDot"></div>
        </div>
      </div>

      <div class="beat-lights" id="beatLights"></div>

      <input type="range" class="bpm-slider" id="bpmSlider" min="40" max="240" value="120">

      <div class="btn-row">
        <button class="btn btn-play" id="playBtn" onclick="toggleMetronome()">▶ PLAY</button>
        <button class="btn btn-tap" onclick="tapTempo()">TAP</button>
      </div>

      <div class="sub-row">
        <button class="sub-btn active" onclick="setSub(1, this)">♩ 1/4</button>
        <button class="sub-btn" onclick="setSub(2, this)">♪ 1/8</button>
        <button class="sub-btn" onclick="setSub(3, this)">♪3 Tresillo</button>
      </div>

      <div class="panel-title" style="margin-top:8px;">Banco de Ritmos</div>
      <div class="rhythm-grid" id="rhythmGrid"></div>
    </div>

    <!-- AFINADOR -->
    <div class="panel">
      <div class="panel-title">Afinador</div>

      <div class="instrument-row" id="instRow"></div>

      <div class="tuner-note">
        <div class="note-big" id="noteDisplay" style="color: var(--purple-400);">—</div>
        <div class="note-freq" id="freqDisplay">Activa el micrófono</div>
      </div>

      <div class="tuner-meter">
        <div class="tuner-center"></div>
        <div class="tuner-needle" id="tunerNeedle"></div>
      </div>
      <div class="tuner-labels">
        <span>♭ Bajo</span>
        <span>Afinado</span>
        <span>Alto ♯</span>
      </div>

      <div class="tuner-status status-idle" id="tunerStatus">Micrófono inactivo</div>

      <div class="btn-row">
        <button class="btn btn-primary" id="micBtn" onclick="toggleTuner()">🎙 ACTIVAR MIC</button>
      </div>

      <div class="panel-title" style="margin-top:8px;">Sesión de hoy</div>
      <div class="timer-display" id="timerDisplay">00:00</div>
      <div class="session-stats">
        <div class="stat-box">
          <div class="stat-num" id="xpEarned">0</div>
          <div class="stat-lbl">XP ganados</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="minPracticed">0</div>
          <div class="stat-lbl">Minutos</div>
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="endSession()">⚔ TERMINAR SESIÓN</button>
    </div>

    <!-- RANGOS -->
    <div class="panel ranks-panel">
      <div class="panel-title">Rango · Progresión</div>
      <div class="ranks-track" id="ranksTrack"></div>
      <div class="xp-bar-wrap">
        <div class="xp-bar-labels">
          <span>Oro III</span>
          <span id="xpLabel">847 / 1200 XP</span>
          <span>Oro II</span>
        </div>
        <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
      </div>
    </div>

  </div>
</div>

<div class="notif" id="notif"></div>

<script>
// ===================== DATOS =====================
const RANKS = [
  { name: 'Nota Perdida', sub: 'I', icon: '🎵', xp: 0 },
  { name: 'Nota Perdida', sub: 'II', icon: '🎵', xp: 200 },
  { name: 'Nota Perdida', sub: 'III', icon: '🎵', xp: 400 },
  { name: 'Aprendiz', sub: 'I', icon: '🥁', xp: 700 },
  { name: 'Aprendiz', sub: 'II', icon: '🥁', xp: 1000 },
  { name: 'Aprendiz', sub: 'III', icon: '🥁', xp: 1400 },
  { name: 'Músico', sub: 'I', icon: '🎸', xp: 2000 },
  { name: 'Músico', sub: 'II', icon: '🎸', xp: 2800 },
  { name: 'Intérprete', sub: 'I', icon: '🎺', xp: 4000 },
  { name: 'Virtuoso', sub: 'I', icon: '🎼', xp: 6000 },
  { name: 'Maestro', sub: '✦', icon: '👑', xp: 10000 },
];

const RHYTHMS = [
  { name: 'Clave Salsa', bpm: 120, beats: 4 },
  { name: 'Cumbia', bpm: 110, beats: 4 },
  { name: 'Bolero', bpm: 72, beats: 4 },
  { name: 'Porro', bpm: 130, beats: 4 },
  { name: 'Vallenato', bpm: 100, beats: 4 },
  { name: 'Jazz Swing', bpm: 140, beats: 4 },
  { name: 'Bossa Nova', bpm: 90, beats: 4 },
  { name: 'Libre', bpm: 120, beats: 4 },
];

const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_NAMES_ES = { 'C':'Do','C#':'Do#','D':'Re','D#':'Re#','E':'Mi','F':'Fa','F#':'Fa#','G':'Sol','G#':'Sol#','A':'La','A#':'La#','B':'Si' };

const INSTRUMENTS = [
  { name: 'Saxofón', key: 'sax' },
  { name: 'Trompeta', key: 'trp' },
  { name: 'Clarinete', key: 'cla' },
  { name: 'Guitarra', key: 'gui' },
  { name: 'Bajo', key: 'bas' },
  { name: 'Voz', key: 'voz' },
];

// ===================== ESTADO =====================
let state = {
  bpm: 120,
  playing: false,
  beats: 4,
  currentBeat: 0,
  subdivision: 1,
  currentRhythm: 'Libre',
  xp: 847,
  streak: 1,
  sessionStart: null,
  sessionActive: false,
  sessionXP: 0,
  instrument: 'sax',
  tunerActive: false,
  audioCtx: null,
  analyser: null,
  micStream: null,
  metroInterval: null,
  tapTimes: [],
  pendulumDir: 1,
};

// ===================== INIT =====================
function init() {
  buildRhythmGrid();
  buildRanksTrack();
  buildBeatLights();
  buildInstruments();
  updateRankDisplay();
  updateXPBar();
  document.getElementById('bpmSlider').addEventListener('input', e => {
    state.bpm = parseInt(e.target.value);
    document.getElementById('bpmDisplay').textContent = state.bpm;
    if (state.playing) { stopMetronome(); startMetronome(); }
  });
}

// ===================== METRÓNOMO =====================
function buildBeatLights() {
  const el = document.getElementById('beatLights');
  el.innerHTML = '';
  for (let i = 0; i < state.beats; i++) {
    const d = document.createElement('div');
    d.className = 'beat-light';
    d.id = 'bl-' + i;
    el.appendChild(d);
  }
}

function toggleMetronome() {
  if (state.playing) stopMetronome(); else startMetronome();
}

function startMetronome() {
  if (!state.sessionActive) startSession();
  state.playing = true;
  state.currentBeat = 0;
  const btn = document.getElementById('playBtn');
  btn.textContent = '■ STOP';
  btn.classList.add('playing');
  scheduleBeat();
}

function stopMetronome() {
  state.playing = false;
  clearTimeout(state.metroInterval);
  const btn = document.getElementById('playBtn');
  btn.textContent = '▶ PLAY';
  btn.classList.remove('playing');
  document.querySelectorAll('.beat-light').forEach(l => l.className = 'beat-light');
  const dot = document.getElementById('pendulumDot');
  dot.classList.remove('playing', 'beat', 'accent');
  dot.style.animationDuration = '';
}

function scheduleBeat() {
  if (!state.playing) return;
  const interval = (60 / state.bpm / state.subdivision) * 1000;
  playClick(state.currentBeat === 0);
  updateBeatVisuals();
  state.currentBeat = (state.currentBeat + 1) % (state.beats * state.subdivision);
  state.metroInterval = setTimeout(scheduleBeat, interval);
}

function playClick(isAccent) {
  try {
    if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = state.audioCtx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = isAccent ? 1800 : 1200;
    gain.gain.setValueAtTime(isAccent ? 0.6 : 0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.05);
  } catch(e) {}
}

function updateBeatVisuals() {
  const beat = Math.floor(state.currentBeat / state.subdivision);
  document.querySelectorAll('.beat-light').forEach((l, i) => {
    l.className = 'beat-light';
    if (i === beat) l.classList.add(beat === 0 ? 'accent-light' : 'active');
  });
  // Péndulo
  const dot = document.getElementById('pendulumDot');
  const interval = (60 / state.bpm / state.subdivision) * 1000;
  dot.classList.add('playing');
  dot.style.animationDuration = (interval * 2) + 'ms';
  if (state.currentBeat === 0) {
    dot.classList.add('accent');
    setTimeout(() => dot.classList.remove('accent'), 80);
  } else {
    dot.classList.add('beat');
    setTimeout(() => dot.classList.remove('beat'), 80);
  }
}

function setSub(val, el) {
  state.subdivision = val;
  state.currentBeat = 0;
  document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  if (state.playing) { stopMetronome(); startMetronome(); }
}

// TAP TEMPO
function tapTempo() {
  const now = Date.now();
  state.tapTimes.push(now);
  if (state.tapTimes.length > 6) state.tapTimes.shift();
  if (state.tapTimes.length >= 2) {
    const diffs = [];
    for (let i = 1; i < state.tapTimes.length; i++) diffs.push(state.tapTimes[i] - state.tapTimes[i-1]);
    const avg = diffs.reduce((a,b) => a+b, 0) / diffs.length;
    const bpm = Math.round(60000 / avg);
    if (bpm >= 40 && bpm <= 240) {
      state.bpm = bpm;
      document.getElementById('bpmDisplay').textContent = bpm;
      document.getElementById('bpmSlider').value = bpm;
      if (state.playing) { stopMetronome(); startMetronome(); }
    }
  }
  showNotif('TAP · ' + state.bpm + ' BPM');
}

// RITMOS
function buildRhythmGrid() {
  const el = document.getElementById('rhythmGrid');
  RHYTHMS.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'rhythm-btn' + (r.name === 'Libre' ? ' active' : '');
    btn.innerHTML = r.name + '<span class="r-bpm">' + r.bpm + ' BPM</span>';
    btn.onclick = () => {
      document.querySelectorAll('.rhythm-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.bpm = r.bpm;
      state.beats = r.beats;
      state.currentRhythm = r.name;
      document.getElementById('bpmDisplay').textContent = r.bpm;
      document.getElementById('bpmSlider').value = r.bpm;
      document.getElementById('rhythmName').textContent = r.name;
      buildBeatLights();
      if (state.playing) { stopMetronome(); startMetronome(); }
    };
    el.appendChild(btn);
  });
}

// ===================== AFINADOR =====================
function buildInstruments() {
  const el = document.getElementById('instRow');
  INSTRUMENTS.forEach(inst => {
    const btn = document.createElement('button');
    btn.className = 'inst-btn' + (inst.key === 'sax' ? ' active' : '');
    btn.textContent = inst.name;
    btn.onclick = () => {
      document.querySelectorAll('.inst-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.instrument = inst.key;
      showNotif('Instrumento: ' + inst.name);
    };
    el.appendChild(btn);
  });
}

async function toggleTuner() {
  if (state.tunerActive) {
    stopTuner();
  } else {
    await startTuner();
  }
}

async function startTuner() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    state.micStream = stream;
    if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = state.audioCtx;
    const source = ctx.createMediaStreamSource(stream);
    state.analyser = ctx.createAnalyser();
    state.analyser.fftSize = 4096;
    source.connect(state.analyser);
    state.tunerActive = true;
    document.getElementById('micBtn').textContent = '🔴 DESACTIVAR';
    document.getElementById('tunerStatus').className = 'tuner-status status-idle';
    document.getElementById('tunerStatus').textContent = 'Escuchando...';
    updateTuner();
  } catch(e) {
    showNotif('Micrófono no disponible');
  }
}

function stopTuner() {
  state.tunerActive = false;
  if (state.micStream) { state.micStream.getTracks().forEach(t => t.stop()); state.micStream = null; }
  document.getElementById('micBtn').textContent = '🎙 ACTIVAR MIC';
  document.getElementById('noteDisplay').textContent = '—';
  document.getElementById('freqDisplay').textContent = 'Micrófono inactivo';
  document.getElementById('tunerNeedle').style.left = '50%';
  document.getElementById('tunerStatus').className = 'tuner-status status-idle';
  document.getElementById('tunerStatus').textContent = 'Micrófono inactivo';
}

function updateTuner() {
  if (!state.tunerActive) return;
  const buf = new Float32Array(state.analyser.fftSize);
  state.analyser.getFloatTimeDomainData(buf);
  const freq = autoCorrelate(buf, state.audioCtx.sampleRate);
  if (freq > 50) {
    const noteNum = 12 * (Math.log2(freq / 440)) + 69;
    const roundedNote = Math.round(noteNum);
    const cents = (noteNum - roundedNote) * 100;
    const noteName = NOTES[((roundedNote % 12) + 12) % 12];
    const octave = Math.floor(roundedNote / 12) - 1;
    const noteES = NOTE_NAMES_ES[noteName];
    document.getElementById('noteDisplay').textContent = noteES + octave;
    document.getElementById('freqDisplay').textContent = freq.toFixed(1) + ' Hz';
    const needlePos = 50 + (cents / 50) * 40;
    const needle = document.getElementById('tunerNeedle');
    needle.style.left = Math.max(5, Math.min(95, needlePos)) + '%';
    const absCents = Math.abs(cents);
    const statusEl = document.getElementById('tunerStatus');
    const noteEl = document.getElementById('noteDisplay');
    if (absCents < 8) {
      needle.style.background = '#1D9E75';
      statusEl.className = 'tuner-status status-in';
      statusEl.textContent = '✓ AFINADO';
      noteEl.style.color = '#1D9E75';
    } else if (cents < 0) {
      needle.style.background = '#E24B4A';
      statusEl.className = 'tuner-status status-low';
      statusEl.textContent = '▲ SUBIR (' + Math.abs(Math.round(cents)) + ' cents)';
      noteEl.style.color = '#E24B4A';
    } else {
      needle.style.background = '#E24B4A';
      statusEl.className = 'tuner-status status-high';
      statusEl.textContent = '▼ BAJAR (' + Math.round(cents) + ' cents)';
      noteEl.style.color = '#E24B4A';
    }
  } else {
    document.getElementById('noteDisplay').textContent = '—';
    document.getElementById('noteDisplay').style.color = 'var(--purple-400)';
    document.getElementById('freqDisplay').textContent = 'Esperando señal...';
  }
  requestAnimationFrame(updateTuner);
}

function autoCorrelate(buf, sampleRate) {
  let SIZE = buf.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.01) return -1;
  let r1 = 0, r2 = SIZE - 1;
  for (let i = 0; i < SIZE / 2; i++) { if (Math.abs(buf[i]) < 0.2) { r1 = i; break; } }
  for (let i = 1; i < SIZE / 2; i++) { if (Math.abs(buf[SIZE - i]) < 0.2) { r2 = SIZE - i; break; } }
  buf = buf.slice(r1, r2);
  SIZE = buf.length;
  const c = new Array(SIZE).fill(0);
  for (let i = 0; i < SIZE; i++) for (let j = 0; j < SIZE - i; j++) c[i] += buf[j] * buf[j + i];
  let d = 0;
  while (c[d] > c[d + 1]) d++;
  let maxval = -1, maxpos = -1;
  for (let i = d; i < SIZE; i++) { if (c[i] > maxval) { maxval = c[i]; maxpos = i; } }
  let T0 = maxpos;
  const x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
  const a = (x1 + x3 - 2 * x2) / 2;
  const b = (x3 - x1) / 2;
  if (a) T0 = T0 - b / (2 * a);
  return sampleRate / T0;
}

// ===================== SESIÓN =====================
function startSession() {
  state.sessionActive = true;
  state.sessionStart = Date.now();
  state.sessionXP = 0;
  updateTimer();
}

function updateTimer() {
  if (!state.sessionActive) return;
  const elapsed = Math.floor((Date.now() - state.sessionStart) / 1000);
  const mins = Math.floor(elapsed / 60);
  const secs = elapsed % 60;
  document.getElementById('timerDisplay').textContent = String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
  const xpThisSession = Math.floor(elapsed / 30) * 5;
  document.getElementById('xpEarned').textContent = xpThisSession;
  document.getElementById('minPracticed').textContent = mins;
  setTimeout(updateTimer, 1000);
}

function endSession() {
  if (!state.sessionActive) { showNotif('Inicia el metrónomo primero'); return; }
  const elapsed = Math.floor((Date.now() - state.sessionStart) / 1000);
  const xpGained = Math.floor(elapsed / 30) * 5;
  state.xp += xpGained;
  state.sessionActive = false;
  stopMetronome();
  stopTuner();
  updateRankDisplay();
  updateXPBar();
  showNotif('¡Sesión terminada! +' + xpGained + ' XP ganados 🏅');
}

// ===================== RANGOS =====================
function getCurrentRank() {
  let rank = RANKS[0];
  for (let i = RANKS.length - 1; i >= 0; i--) {
    if (state.xp >= RANKS[i].xp) { rank = RANKS[i]; break; }
  }
  return rank;
}

function buildRanksTrack() {
  const el = document.getElementById('ranksTrack');
  RANKS.forEach((r, i) => {
    const div = document.createElement('div');
    div.className = 'rank-item';
    div.id = 'rank-' + i;
    div.innerHTML = '<div class="rank-item-icon">' + r.icon + '</div><div class="rank-item-name">' + r.name + '<br>' + r.sub + '</div>';
    el.appendChild(div);
  });
}

function updateRankDisplay() {
  let currentIdx = 0;
  for (let i = RANKS.length - 1; i >= 0; i--) {
    if (state.xp >= RANKS[i].xp) { currentIdx = i; break; }
  }
  RANKS.forEach((r, i) => {
    const el = document.getElementById('rank-' + i);
    el.className = 'rank-item';
    if (i < currentIdx) el.classList.add('achieved');
    if (i === currentIdx) el.classList.add('current');
  });
  const cur = RANKS[currentIdx];
  const next = RANKS[Math.min(currentIdx + 1, RANKS.length - 1)];
  document.getElementById('rankName').textContent = cur.name.toUpperCase() + ' ' + cur.sub;
  document.getElementById('rankPts').textContent = state.xp + ' / ' + next.xp + ' XP';
  document.getElementById('rankIcon').textContent = cur.icon;
}

function updateXPBar() {
  let currentIdx = 0;
  for (let i = RANKS.length - 1; i >= 0; i--) {
    if (state.xp >= RANKS[i].xp) { currentIdx = i; break; }
  }
  const cur = RANKS[currentIdx];
  const next = RANKS[Math.min(currentIdx + 1, RANKS.length - 1)];
  const pct = Math.min(100, ((state.xp - cur.xp) / (next.xp - cur.xp)) * 100);
  document.getElementById('xpFill').style.width = pct + '%';
  document.getElementById('xpLabel').textContent = state.xp + ' / ' + next.xp + ' XP';
}

// ===================== NOTIF =====================
function showNotif(msg) {
  const el = document.getElementById('notif');
  el.textContent = msg;
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 2000);
}

// ===================== ARRANCAR =====================
init();
</script>

</html>
