<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>¡¿Hazta Cuándo?!</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09071A;
    --bg2: #13103A;
    --bg3: #1E1A52;
    --purple: #4C3FD4;
    --purple2: #7B6FEE;
    --purple3: #AFA9EC;
    --gold: #C8A94A;
    --goldf: #F0D080;
    --red: #E24B4A;
    --green: #1DBF87;
    --border: rgba(76,63,212,0.4);
    --text: #EEEDFE;
    --muted: #8B85CC;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    overscroll-behavior: none;
  }

  /* Fondo animado */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% 40%, rgba(76,63,212,0.18) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 15%, rgba(123,111,238,0.12) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 90%, rgba(200,169,74,0.07) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 0 80px;
  }

  /* ── HEADER ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    background: rgba(9,7,26,0.9);
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(10px);
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 900;
    color: var(--purple3);
    letter-spacing: 0.03em;
    line-height: 1.2;
  }
  .logo em { color: var(--gold); font-style: normal; }

  .header-right { display: flex; align-items: center; gap: 10px; }

  .streak {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(200,169,74,0.12);
    border: 1px solid rgba(200,169,74,0.35);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
  }

  .rank-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(76,63,212,0.2);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 20px;
  }
  .rank-chip-icon { font-size: 16px; }
  .rank-chip-name { font-size: 11px; font-weight: 700; color: var(--gold); }

  /* ── TABS ── */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 53px;
    z-index: 9;
  }

  .tab {
    flex: 1;
    padding: 12px 0;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }

  .tab.active {
    color: var(--purple2);
    border-bottom-color: var(--purple2);
  }

  /* ── SCREENS ── */
  .screen { display: none; padding: 16px; }
  .screen.active { display: block; }

  /* ── CARDS ── */
  .card {
    background: rgba(19,16,58,0.7);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
    backdrop-filter: blur(6px);
  }

  .card-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--purple2);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title::before {
    content: '';
    width: 3px; height: 12px;
    background: var(--purple);
    border-radius: 2px;
  }

  /* ── METRÓNOMO ── */
  .bpm-hero {
    text-align: center;
    padding: 8px 0 4px;
  }

  .bpm-number {
    font-family: 'Orbitron', monospace;
    font-size: 80px;
    font-weight: 900;
    line-height: 1;
    color: var(--text);
    text-shadow: 0 0 40px rgba(123,111,238,0.6);
    letter-spacing: -2px;
  }

  .bpm-unit {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.2em;
    margin-top: 2px;
  }

  /* Péndulo */
  .pendulum-area {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 56px;
    margin: 12px 0;
  }

  .pend-track {
    width: 200px;
    height: 3px;
    background: rgba(76,63,212,0.25);
    border-radius: 2px;
    position: relative;
  }

  .pend-ball {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--purple2);
    position: absolute;
    top: -10px; left: 0;
    box-shadow: 0 0 14px rgba(123,111,238,0.8);
    transition: background 0.08s;
  }

  .pend-ball.on-beat { background: var(--gold); box-shadow: 0 0 20px rgba(200,169,74,0.9); }
  .pend-ball.playing { animation: swing linear infinite; }
  @keyframes swing { 0%{left:0} 50%{left:calc(100% - 22px)} 100%{left:0} }

  /* Luces de tiempo */
  .beat-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .beat-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: rgba(76,63,212,0.25);
    border: 1px solid rgba(76,63,212,0.4);
    transition: all 0.05s;
  }
  .beat-dot.lit { background: var(--purple2); box-shadow: 0 0 8px rgba(123,111,238,0.7); }
  .beat-dot.lit-accent { background: var(--gold); box-shadow: 0 0 14px rgba(200,169,74,0.9); transform: scale(1.25); }

  /* Slider BPM */
  .slider-wrap { margin-bottom: 16px; }

  .slider-labels {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 5px;
    border-radius: 3px;
    background: rgba(76,63,212,0.3);
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--purple2);
    cursor: pointer;
    box-shadow: 0 0 10px rgba(123,111,238,0.7);
  }

  /* Botones principales */
  .btn-row { display: flex; gap: 10px; margin-bottom: 12px; }

  .btn {
    flex: 1;
    padding: 13px 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(76,63,212,0.18);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    touch-action: manipulation;
  }
  .btn:active { transform: scale(0.95); opacity: 0.85; }
  .btn-play { background: var(--purple); border-color: var(--purple2); font-size: 18px; }
  .btn-play.stop { background: rgba(226,75,74,0.25); border-color: var(--red); color: var(--red); }
  .btn-tap { background: rgba(200,169,74,0.12); border-color: rgba(200,169,74,0.4); color: var(--gold); }

  /* Subdivisiones */
  .sub-row { display: flex; gap: 6px; margin-bottom: 14px; }
  .sub-btn {
    flex: 1;
    padding: 8px 4px;
    border-radius: 8px;
    border: 1px solid rgba(76,63,212,0.3);
    background: rgba(9,7,26,0.5);
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    touch-action: manipulation;
  }
  .sub-btn.active { background: rgba(76,63,212,0.35); border-color: var(--purple2); color: var(--text); }

  /* Ritmos */
  .rhythm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .rbtn {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(76,63,212,0.3);
    background: rgba(9,7,26,0.5);
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    touch-action: manipulation;
  }
  .rbtn span { display: block; font-size: 10px; color: rgba(139,133,204,0.7); margin-top: 1px; }
  .rbtn:active { transform: scale(0.97); }
  .rbtn.active { border-color: var(--gold); background: rgba(200,169,74,0.1); color: var(--gold); }
  .rbtn.active span { color: rgba(200,169,74,0.7); }

  /* ── AFINADOR ── */
  .inst-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 16px;
    scrollbar-width: none;
  }
  .inst-scroll::-webkit-scrollbar { display: none; }

  .inst-btn {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid rgba(76,63,212,0.35);
    background: rgba(9,7,26,0.6);
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    touch-action: manipulation;
  }
  .inst-btn.active { border-color: var(--purple2); background: rgba(76,63,212,0.3); color: var(--text); }

  .note-hero {
    text-align: center;
    margin: 8px 0 16px;
  }

  .note-big {
    font-family: 'Orbitron', monospace;
    font-size: 72px;
    font-weight: 900;
    line-height: 1;
    color: var(--muted);
    transition: color 0.2s;
  }

  .note-hz { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .tuner-bar {
    position: relative;
    height: 28px;
    background: rgba(76,63,212,0.15);
    border-radius: 14px;
    border: 1px solid var(--border);
    margin-bottom: 8px;
    overflow: hidden;
  }

  .tuner-center-line {
    position: absolute;
    left: 50%; top: 0; bottom: 0;
    width: 2px;
    background: rgba(123,111,238,0.4);
    transform: translateX(-50%);
  }

  .tuner-needle {
    position: absolute;
    top: 5px; bottom: 5px;
    width: 5px;
    border-radius: 3px;
    background: var(--purple2);
    left: 50%;
    transform: translateX(-50%);
    transition: left 0.12s ease, background 0.2s;
    box-shadow: 0 0 8px currentColor;
  }

  .tuner-ends {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 14px;
    padding: 0 4px;
  }

  .tuner-status {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 14px;
  }
  .s-idle { background: rgba(76,63,212,0.12); color: var(--muted); border: 1px solid var(--border); }
  .s-in { background: rgba(29,191,135,0.12); color: var(--green); border: 1px solid rgba(29,191,135,0.3); }
  .s-low, .s-high { background: rgba(226,75,74,0.12); color: var(--red); border: 1px solid rgba(226,75,74,0.3); }

  .btn-mic {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--purple2);
    background: var(--purple);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.15s;
    touch-action: manipulation;
  }
  .btn-mic:active { transform: scale(0.97); }
  .btn-mic.on { background: rgba(226,75,74,0.2); border-color: var(--red); color: var(--red); }

  /* ── SESIÓN ── */
  .timer-big {
    font-family: 'Orbitron', monospace;
    font-size: 52px;
    font-weight: 900;
    text-align: center;
    color: var(--text);
    letter-spacing: 2px;
    margin: 8px 0 16px;
    text-shadow: 0 0 30px rgba(123,111,238,0.4);
  }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat {
    background: rgba(76,63,212,0.12);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .stat-n { font-family: 'Orbitron', monospace; font-size: 24px; font-weight: 700; color: var(--text); }
  .stat-l { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }

  .btn-end {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid var(--gold);
    background: rgba(200,169,74,0.12);
    color: var(--gold);
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.15s;
    touch-action: manipulation;
    text-transform: uppercase;
  }
  .btn-end:active { transform: scale(0.97); }

  /* ── RANGOS ── */
  .ranks-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: none;
    margin-bottom: 16px;
  }
  .ranks-scroll::-webkit-scrollbar { display: none; }

  .rank-card {
    flex-shrink: 0;
    width: 72px;
    text-align: center;
    padding: 10px 6px;
    border-radius: 10px;
    border: 1px solid rgba(76,63,212,0.25);
    background: rgba(9,7,26,0.5);
    opacity: 0.4;
    transition: all 0.2s;
  }
  .rank-card.done { opacity: 0.7; border-color: rgba(76,63,212,0.5); }
  .rank-card.now { opacity: 1; border-color: var(--gold); background: rgba(200,169,74,0.08); box-shadow: 0 0 16px rgba(200,169,74,0.15); }

  .rank-card-icon { font-size: 24px; margin-bottom: 4px; }
  .rank-card-name { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; line-height: 1.3; }
  .rank-card.now .rank-card-name { color: var(--gold); }

  .xp-section { margin-top: 4px; }
  .xp-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-bottom: 6px; }
  .xp-track { height: 7px; background: rgba(76,63,212,0.2); border-radius: 4px; overflow: hidden; }
  .xp-fill { height: 100%; background: linear-gradient(90deg, var(--purple), var(--gold)); border-radius: 4px; transition: width 0.6s ease; width: 35%; }

  /* ── NOTIF ── */
  .notif {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(200,169,74,0.95);
    color: #1A1200;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
    max-width: 90vw;
    text-align: center;
  }

  /* ── NAV BOTTOM ── */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    background: rgba(9,7,26,0.97);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(10px);
    z-index: 20;
    max-width: 480px;
    margin: 0 auto;
  }

  .nav-btn {
    flex: 1;
    padding: 10px 0 8px;
    text-align: center;
    cursor: pointer;
    touch-action: manipulation;
    transition: all 0.15s;
  }

  .nav-btn-icon { font-size: 22px; display: block; }
  .nav-btn-label { font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  .nav-btn.active .nav-btn-label { color: var(--purple2); }
  .nav-btn.active .nav-btn-icon { filter: drop-shadow(0 0 4px rgba(123,111,238,0.8)); }
</style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">¡¿<em>H</em>azta<br><em>C</em>uándo?!</div>
    <div class="header-right">
      <div class="streak">🔥 <span id="streakN">1</span></div>
      <div class="rank-chip">
        <span class="rank-chip-icon" id="hIcon">🏅</span>
        <span class="rank-chip-name" id="hRank">Oro III</span>
      </div>
    </div>
  </div>

  <!-- SCREENS -->

  <!-- METRÓNOMO -->
  <div class="screen active" id="s-metro">

    <div class="card">
      <div class="card-title">Metrónomo</div>

      <div class="bpm-hero">
        <div class="bpm-number" id="bpmN">120</div>
        <div class="bpm-unit">BPM · <span id="rName">Libre</span></div>
      </div>

      <div class="pendulum-area">
        <div class="pend-track">
          <div class="pend-ball" id="pBall"></div>
        </div>
      </div>

      <div class="beat-row" id="beatRow"></div>

      <div class="slider-wrap">
        <div class="slider-labels"><span>40</span><span id="bpmSliderVal">120 BPM</span><span>240</span></div>
        <input type="range" id="bpmSlider" min="40" max="240" value="120">
      </div>

      <div class="btn-row">
        <button class="btn btn-play" id="playBtn" onclick="toggleMetro()">▶</button>
        <button class="btn btn-tap" onclick="tap()">TAP</button>
      </div>

      <div class="sub-row">
        <button class="sub-btn active" onclick="setSub(1,this)">♩ 1/4</button>
        <button class="sub-btn" onclick="setSub(2,this)">♪ 1/8</button>
        <button class="sub-btn" onclick="setSub(3,this)">♪³ Tresillo</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Banco de Ritmos</div>
      <div class="rhythm-grid" id="rhythmGrid"></div>
    </div>

  </div>

  <!-- AFINADOR -->
  <div class="screen" id="s-tune">

    <div class="card">
      <div class="card-title">Instrumento</div>
      <div class="inst-scroll" id="instRow"></div>
    </div>

    <div class="card">
      <div class="card-title">Afinador</div>

      <div class="note-hero">
        <div class="note-big" id="noteD">—</div>
        <div class="note-hz" id="hzD">Activa el micrófono</div>
      </div>

      <div class="tuner-bar">
        <div class="tuner-center-line"></div>
        <div class="tuner-needle" id="needle"></div>
      </div>
      <div class="tuner-ends"><span>♭ Bajo</span><span>● Afinado</span><span>Alto ♯</span></div>

      <div class="tuner-status s-idle" id="tStatus">Micrófono inactivo</div>

      <button class="btn-mic" id="micBtn" onclick="toggleTuner()">🎙 ACTIVAR MICRÓFONO</button>
    </div>

  </div>

  <!-- SESIÓN -->
  <div class="screen" id="s-session">

    <div class="card">
      <div class="card-title">Tiempo de sesión</div>
      <div class="timer-big" id="timerD">00:00</div>
      <div class="stats-grid">
        <div class="stat"><div class="stat-n" id="xpD">0</div><div class="stat-l">XP ganados</div></div>
        <div class="stat"><div class="stat-n" id="minD">0</div><div class="stat-l">Minutos</div></div>
      </div>
      <button class="btn-end" onclick="endSession()">⚔ Terminar sesión</button>
    </div>

    <div class="card">
      <div class="card-title">Progresión de Rango</div>
      <div class="ranks-scroll" id="ranksRow"></div>
      <div class="xp-section">
        <div class="xp-labels">
          <span id="xpCurRank">Oro III</span>
          <span id="xpProgress">847 / 1200 XP</span>
          <span id="xpNextRank">Oro II</span>
        </div>
        <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
      </div>
    </div>

  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-btn active" id="nav-metro" onclick="goTo('metro')">
    <span class="nav-btn-icon">🥁</span>
    <div class="nav-btn-label">Metrónomo</div>
  </div>
  <div class="nav-btn" id="nav-tune" onclick="goTo('tune')">
    <span class="nav-btn-icon">🎵</span>
    <div class="nav-btn-label">Afinador</div>
  </div>
  <div class="nav-btn" id="nav-session" onclick="goTo('session')">
    <span class="nav-btn-icon">⚔</span>
    <div class="nav-btn-label">Sesión</div>
  </div>
</div>

<div class="notif" id="notif"></div>

<script>
// ── DATOS ──
const RANKS = [
  {n:'Nota Perdida',s:'I',ic:'🎵',xp:0},
  {n:'Nota Perdida',s:'II',ic:'🎵',xp:200},
  {n:'Nota Perdida',s:'III',ic:'🎵',xp:400},
  {n:'Aprendiz',s:'I',ic:'🥁',xp:700},
  {n:'Aprendiz',s:'II',ic:'🥁',xp:1000},
  {n:'Aprendiz',s:'III',ic:'🥁',xp:1400},
  {n:'Músico',s:'I',ic:'🎸',xp:2000},
  {n:'Músico',s:'II',ic:'🎸',xp:2800},
  {n:'Intérprete',s:'I',ic:'🎺',xp:4000},
  {n:'Virtuoso',s:'✦',ic:'🎼',xp:6000},
  {n:'Maestro',s:'✦',ic:'👑',xp:10000},
];

const RHYTHMS = [
  {n:'Clave Salsa', bpm:120, b:4},
  {n:'Cumbia', bpm:110, b:4},
  {n:'Bolero', bpm:72, b:4},
  {n:'Porro', bpm:130, b:4},
  {n:'Vallenato', bpm:100, b:4},
  {n:'Jazz Swing', bpm:140, b:4},
  {n:'Bossa Nova', bpm:90, b:4},
  {n:'Libre', bpm:120, b:4},
];

const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const ES = {C:'Do','C#':'Do#',D:'Re','D#':'Re#',E:'Mi',F:'Fa','F#':'Fa#',G:'Sol','G#':'Sol#',A:'La','A#':'La#',B:'Si'};

const INSTS = ['Saxofón','Trompeta','Clarinete','Guitarra','Bajo','Voz'];

// ── ESTADO ──
let S = {
  bpm:120, playing:false, beat:0, sub:1, beats:4,
  xp:847, streak:1, inst:'Saxofón',
  tunerOn:false, sessionOn:false, sessionStart:null, sessionXP:0,
  audioCtx:null, analyser:null, micStream:null,
  metroTimer:null, tapTimes:[],
};

// ── NAVEGACIÓN ──
function goTo(tab) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('s-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
}

// ── INIT ──
function init() {
  buildBeatRow();
  buildRhythms();
  buildInsts();
  buildRanks();
  updateRank();
  updateXP();

  document.getElementById('bpmSlider').addEventListener('input', e => {
    S.bpm = +e.target.value;
    document.getElementById('bpmN').textContent = S.bpm;
    document.getElementById('bpmSliderVal').textContent = S.bpm + ' BPM';
    if (S.playing) { stopMetro(); startMetro(); }
  });
}

// ── METRÓNOMO ──
function buildBeatRow() {
  const el = document.getElementById('beatRow');
  el.innerHTML = '';
  for (let i=0;i<S.beats;i++) {
    const d = document.createElement('div');
    d.className='beat-dot'; d.id='bd'+i;
    el.appendChild(d);
  }
}

function toggleMetro() {
  S.playing ? stopMetro() : startMetro();
}

function startMetro() {
  if (!S.sessionOn) startSession();
  S.playing = true; S.beat = 0;
  const b = document.getElementById('playBtn');
  b.textContent='■'; b.classList.add('stop');
  tick();
}

function stopMetro() {
  S.playing = false;
  clearTimeout(S.metroTimer);
  const b = document.getElementById('playBtn');
  b.textContent='▶'; b.classList.remove('stop');
  document.querySelectorAll('.beat-dot').forEach(d=>d.className='beat-dot');
  const ball = document.getElementById('pBall');
  ball.classList.remove('playing','on-beat');
  ball.style.animationDuration='';
}

function tick() {
  if (!S.playing) return;
  const ms = (60/S.bpm/S.sub)*1000;
  const isAcc = S.beat===0;
  click(isAcc);
  lightBeats(isAcc);
  S.beat = (S.beat+1)%(S.beats*S.sub);
  S.metroTimer = setTimeout(tick, ms);
}

function click(acc) {
  try {
    if (!S.audioCtx) S.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const ctx = S.audioCtx;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = acc ? 1800 : 1200;
    g.gain.setValueAtTime(acc?0.5:0.25, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.05);
    o.start(); o.stop(ctx.currentTime+0.05);
  } catch(e){}
}

function lightBeats(acc) {
  const beat = Math.floor(S.beat/S.sub);
  document.querySelectorAll('.beat-dot').forEach((d,i)=>{
    d.className='beat-dot';
    if(i===beat) d.classList.add(acc?'lit-accent':'lit');
  });
  const ball = document.getElementById('pBall');
  const ms = (60/S.bpm/S.sub)*1000;
  ball.classList.add('playing');
  ball.style.animationDuration=(ms*2)+'ms';
  ball.classList.add('on-beat');
  setTimeout(()=>ball.classList.remove('on-beat'),80);
}

function setSub(v,el) {
  S.sub=v; S.beat=0;
  document.querySelectorAll('.sub-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  if(S.playing){stopMetro();startMetro();}
}

function tap() {
  const now = Date.now();
  S.tapTimes.push(now);
  if(S.tapTimes.length>6) S.tapTimes.shift();
  if(S.tapTimes.length>=2){
    const diffs=[];
    for(let i=1;i<S.tapTimes.length;i++) diffs.push(S.tapTimes[i]-S.tapTimes[i-1]);
    const avg=diffs.reduce((a,b)=>a+b,0)/diffs.length;
    const bpm=Math.round(60000/avg);
    if(bpm>=40&&bpm<=240){
      S.bpm=bpm;
      document.getElementById('bpmN').textContent=bpm;
      document.getElementById('bpmSlider').value=bpm;
      document.getElementById('bpmSliderVal').textContent=bpm+' BPM';
      if(S.playing){stopMetro();startMetro();}
      notif('TAP · '+bpm+' BPM');
    }
  }
}

function buildRhythms() {
  const el = document.getElementById('rhythmGrid');
  RHYTHMS.forEach(r=>{
    const b=document.createElement('button');
    b.className='rbtn'+(r.n==='Libre'?' active':'');
    b.innerHTML=r.n+'<span>'+r.bpm+' BPM</span>';
    b.onclick=()=>{
      document.querySelectorAll('.rbtn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      S.bpm=r.bpm; S.beats=r.b; S.beat=0;
      document.getElementById('bpmN').textContent=r.bpm;
      document.getElementById('bpmSlider').value=r.bpm;
      document.getElementById('bpmSliderVal').textContent=r.bpm+' BPM';
      document.getElementById('rName').textContent=r.n;
      buildBeatRow();
      if(S.playing){stopMetro();startMetro();}
    };
    el.appendChild(b);
  });
}

// ── AFINADOR ──
function buildInsts() {
  const el = document.getElementById('instRow');
  INSTS.forEach(i=>{
    const b=document.createElement('button');
    b.className='inst-btn'+(i==='Saxofón'?' active':'');
    b.textContent=i;
    b.onclick=()=>{
      document.querySelectorAll('.inst-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      S.inst=i;
      notif('🎵 '+i);
    };
    el.appendChild(b);
  });
}

async function toggleTuner() {
  S.tunerOn ? stopTuner() : await startTuner();
}

async function startTuner() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    S.micStream=stream;
    if(!S.audioCtx) S.audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const src=S.audioCtx.createMediaStreamSource(stream);
    S.analyser=S.audioCtx.createAnalyser();
    S.analyser.fftSize=4096;
    src.connect(S.analyser);
    S.tunerOn=true;
    document.getElementById('micBtn').textContent='🔴 DESACTIVAR MICRÓFONO';
    document.getElementById('micBtn').classList.add('on');
    setStatus('s-idle','Escuchando...');
    tunerLoop();
  } catch(e){ notif('⚠ Micrófono no disponible'); }
}

function stopTuner() {
  S.tunerOn=false;
  if(S.micStream){S.micStream.getTracks().forEach(t=>t.stop());S.micStream=null;}
  document.getElementById('micBtn').textContent='🎙 ACTIVAR MICRÓFONO';
  document.getElementById('micBtn').classList.remove('on');
  document.getElementById('noteD').textContent='—';
  document.getElementById('noteD').style.color='var(--muted)';
  document.getElementById('hzD').textContent='Micrófono inactivo';
  document.getElementById('needle').style.left='50%';
  setStatus('s-idle','Micrófono inactivo');
}

function tunerLoop() {
  if(!S.tunerOn) return;
  const buf=new Float32Array(S.analyser.fftSize);
  S.analyser.getFloatTimeDomainData(buf);
  const freq=autocorr(buf,S.audioCtx.sampleRate);
  const noteEl=document.getElementById('noteD');
  if(freq>50){
    const nn=12*(Math.log2(freq/440))+69;
    const rn=Math.round(nn);
    const cents=(nn-rn)*100;
    const name=NOTES[((rn%12)+12)%12];
    const oct=Math.floor(rn/12)-1;
    noteEl.textContent=(ES[name]||name)+oct;
    document.getElementById('hzD').textContent=freq.toFixed(1)+' Hz';
    const pos=50+(cents/50)*40;
    const needle=document.getElementById('needle');
    needle.style.left=Math.max(5,Math.min(95,pos))+'%';
    if(Math.abs(cents)<8){
      needle.style.background='var(--green)';
      noteEl.style.color='var(--green)';
      setStatus('s-in','✓ AFINADO');
    } else if(cents<0){
      needle.style.background='var(--red)';
      noteEl.style.color='var(--red)';
      setStatus('s-low','▲ SUBIR ('+Math.abs(Math.round(cents))+' cents)');
    } else {
      needle.style.background='var(--red)';
      noteEl.style.color='var(--red)';
      setStatus('s-high','▼ BAJAR ('+Math.round(cents)+' cents)');
    }
  } else {
    noteEl.textContent='—';
    noteEl.style.color='var(--muted)';
    document.getElementById('hzD').textContent='Esperando señal...';
  }
  requestAnimationFrame(tunerLoop);
}

function setStatus(cls,txt){
  const el=document.getElementById('tStatus');
  el.className='tuner-status '+cls;
  el.textContent=txt;
}

function autocorr(buf,sr){
  let SIZE=buf.length,rms=0;
  for(let i=0;i<SIZE;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/SIZE);
  if(rms<0.01) return -1;
  let r1=0,r2=SIZE-1;
  for(let i=0;i<SIZE/2;i++){if(Math.abs(buf[i])<0.2){r1=i;break;}}
  for(let i=1;i<SIZE/2;i++){if(Math.abs(buf[SIZE-i])<0.2){r2=SIZE-i;break;}}
  buf=buf.slice(r1,r2); SIZE=buf.length;
  const c=new Array(SIZE).fill(0);
  for(let i=0;i<SIZE;i++) for(let j=0;j<SIZE-i;j++) c[i]+=buf[j]*buf[j+i];
  let d=0; while(c[d]>c[d+1]) d++;
  let mv=-1,mp=-1;
  for(let i=d;i<SIZE;i++){if(c[i]>mv){mv=c[i];mp=i;}}
  let T=mp;
  const x1=c[T-1],x2=c[T],x3=c[T+1];
  const a=(x1+x3-2*x2)/2,b=(x3-x1)/2;
  if(a) T=T-b/(2*a);
  return sr/T;
}

// ── SESIÓN ──
function startSession(){
  S.sessionOn=true; S.sessionStart=Date.now(); S.sessionXP=0;
  tickTimer();
}

function tickTimer(){
  if(!S.sessionOn) return;
  const e=Math.floor((Date.now()-S.sessionStart)/1000);
  const m=Math.floor(e/60),s=e%60;
  document.getElementById('timerD').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  const xp=Math.floor(e/30)*5;
  document.getElementById('xpD').textContent=xp;
  document.getElementById('minD').textContent=m;
  setTimeout(tickTimer,1000);
}

function endSession(){
  if(!S.sessionOn){notif('¡Inicia el metrónomo primero!');return;}
  const e=Math.floor((Date.now()-S.sessionStart)/1000);
  const xp=Math.floor(e/30)*5;
  S.xp+=xp; S.sessionOn=false;
  stopMetro(); stopTuner();
  updateRank(); updateXP();
  notif('🏅 +'+xp+' XP ganados. ¡Hazta Cuándo!');
}

// ── RANGOS ──
function buildRanks(){
  const el=document.getElementById('ranksRow');
  RANKS.forEach((r,i)=>{
    const d=document.createElement('div');
    d.className='rank-card'; d.id='rc'+i;
    d.innerHTML='<div class="rank-card-icon">'+r.ic+'</div><div class="rank-card-name">'+r.n+'<br>'+r.s+'</div>';
    el.appendChild(d);
  });
}

function updateRank(){
  let ci=0;
  for(let i=RANKS.length-1;i>=0;i--) if(S.xp>=RANKS[i].xp){ci=i;break;}
  RANKS.forEach((_,i)=>{
    const el=document.getElementById('rc'+i);
    el.className='rank-card';
    if(i<ci) el.classList.add('done');
    if(i===ci) el.classList.add('now');
  });
  const cur=RANKS[ci];
  document.getElementById('hIcon').textContent=cur.ic;
  document.getElementById('hRank').textContent=cur.n+' '+cur.s;
}

function updateXP(){
  let ci=0;
  for(let i=RANKS.length-1;i>=0;i--) if(S.xp>=RANKS[i].xp){ci=i;break;}
  const cur=RANKS[ci];
  const nxt=RANKS[Math.min(ci+1,RANKS.length-1)];
  const pct=Math.min(100,((S.xp-cur.xp)/(nxt.xp-cur.xp))*100);
  document.getElementById('xpFill').style.width=pct+'%';
  document.getElementById('xpProgress').textContent=S.xp+' / '+nxt.xp+' XP';
  document.getElementById('xpCurRank').textContent=cur.n+' '+cur.s;
  document.getElementById('xpNextRank').textContent=nxt.n+' '+nxt.s;
}

// ── NOTIF ──
function notif(msg){
  const el=document.getElementById('notif');
  el.textContent=msg; el.style.opacity='1';
  setTimeout(()=>el.style.opacity='0',2500);
}

init();
</script>
